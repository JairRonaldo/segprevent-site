  <script>
    (function () {
      if (!window.SEGPREVENT_LOGO) return;
      var l = document.createElement('link');
      l.rel = 'icon'; l.type = 'image/png'; l.href = window.SEGPREVENT_LOGO;
      document.head.appendChild(l);
      var a = document.createElement('link');
      a.rel = 'apple-touch-icon'; a.href = window.SEGPREVENT_LOGO;
      document.head.appendChild(a);
    })();
  </script>
  <title>SegPrevent Assessoria — Segurança do trabalho que previne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="src/styles.css" />
  <style>
    html:not(.fonts-ready) body { visibility: hidden; }
  </style>
  <script>
    (function () {
      var done = function () { document.documentElement.classList.add('fonts-ready'); };
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(done).catch(done);
      } else {
        done();
      }
      setTimeout(done, 500); // safety net so content never stays hidden
    })();
  </script>
</head>
